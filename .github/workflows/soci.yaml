name: SOCI
on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v3
      - name: Configure AWS Credentials
        id: login-aws
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
        with:
          mask-password: 'true'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - run: |
          echo ${{ steps.login-ecr.outputs[format('docker_username_{0}_dkr_ecr_eu_central_1_amazonaws_com', steps.login-aws.outputs.registry.aws-account-id)] }}
      - name: Create SOCI INDEX
        uses: MayurDuduka/soci-index-action@v4.4
        with:
          registry: ${{ steps.login-ecr.outputs.registry }}
          registry_user: ${{ steps.login-ecr.outputs[format('docker_username_{0}_dkr_ecr_eu_central_1_amazonaws_com', steps.login-aws.outputs.registry.aws-account-id)] }}
          registry_password: ${{ steps.login-ecr.outputs[format('docker_password_{0}_dkr_ecr_eu_central_1_amazonaws_com', steps.login-aws.outputs.registry.aws-account-id)] }}
          repo_name: 'clamav'
          tag_name: 'anti-v2'