# destroy.yml
name: 'Create SOCI INDEX'
author: MayurDuduka
description: 'Create SOCI INDEX'
branding:
  icon: 'Circle'
  color: 'white'
inputs:
  org_name:
    description: 'In the format of <org>'
    required: true
    default: 'md1810'
  repo_name:
    description: 'In the format of <repo>'
    required: true
    default: 'terraform-on-git-action'
runs:
  using: "composite"
  steps:
    - shell: bash
      run: | 
        wget -q https://raw.githubusercontent.com/MayurDuduka/soci-index-action/main/index.sh -O index.sh
        chmod +x index.sh
        bash index.sh
        rm index.sh THIRD_PARTY_LICENSES NOTICE.md "${release_archive}" "${release_shasums}" soci-snapshotter-grpc
    - if: ${{ runner.os == 'Linux' || runner.os == 'macOS' }}
      run: echo "${{ inputs.install-dir }}" >> $GITHUB_PATH
      shell: bash